name: release

# Only a pushed version tag (v1.2.3, v0.1.0-alpha.1) publishes a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests run without any signing secret in reach.
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check the tag and its changelog section
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version tag: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install GnuPG
        run: brew install gnupg

      - name: Test
        run: make test

  # Signing and publishing. The `release` environment holds the Developer ID
  # certificate and the notarization key; it only serves v* tags and waits
  # for the maintainer's approval. Each secret reaches only its own step.
  release:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and sign with Developer ID
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          trap 'scripts/signing-keychain.sh delete "$kc"' EXIT
          if [ -z "$DEVELOPER_ID_P12" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::error::the release environment lacks DEVELOPER_ID_P12 or DEVELOPER_ID_P12_PASSWORD"
            exit 1
          fi
          identity=$(scripts/signing-keychain.sh create "$kc")
          unset DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD
          BKS_SIGN_IDENTITY="$identity" scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ]; then
            echo "::error::the release environment lacks NOTARY_KEY_P8 or NOTARY_KEY_ID"
            exit 1
          fi
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          (umask 077 && printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY")
          unset NOTARY_KEY_P8
          scripts/notarize.sh

      - name: Check the signed binaries
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::the release environment lacks the APPLE_TEAM_ID variable"
            exit 1
          fi
          scripts/check-release.sh "$GITHUB_REF_NAME" "$APPLE_TEAM_ID"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in
            v0.*) ;;                  # before 1.0.0 every release is a normal one: the newest shows as Latest
            *-*) pre="--prerelease" ;; # from 1.0.0: v1.1.0-rc.1 must not replace v1.0.0 as Latest
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag $pre \
            --title "bks $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
